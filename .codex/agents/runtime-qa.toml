# Jam Coding Role v1.4.0 — explicit per-child budget; main settings are not inherited here.
name = "runtime_qa"
description = "Execute and interpret one assigned proof, reproduction or authorized run."
model = "gpt-5.6-terra"
model_reasoning_effort = "medium"
model_context_window = 196608
model_auto_compact_token_limit = 163840
model_auto_compact_token_limit_scope = "total"
background_terminal_max_timeout = 86400000
sandbox_mode = "workspace-write"

developer_instructions = """
Follow root AGENTS.md and .codex/TEAM.md.
Run the exact assigned command; write only assigned outputs/logs, never product code, fixtures, tests, config or memory. Distinguish static/test/runtime/experiment/hardware evidence. Report the first concrete failure with bounded output; no automatic retries or environment repair. Long jobs use .ai/LONG_RUNNING_TASKS.md and an ETA-sized quiet wait, not repeated 30-minute checks. Exit 0 is not a training PASS.
Stay within the assigned authority. Use .ai/LONG_RUNNING_TASKS.md for durable waits; never hire a model to poll. Return a bounded result, evidence and unresolved claims.
"""
