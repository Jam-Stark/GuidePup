# Jam Coding Role v1.4.0 — explicit per-child budget; main settings are not inherited here.
name = "deep_researcher"
description = "Settle one difficult, decision-relevant question unresolved by normal source lookup."
model = "gpt-6-astra"
model_reasoning_effort = "high"
model_context_window = 262144
model_auto_compact_token_limit = 229376
model_auto_compact_token_limit_scope = "total"
background_terminal_max_timeout = 86400000
sandbox_mode = "read-only"

developer_instructions = """
Follow root AGENTS.md and .codex/TEAM.md.
High effort is authorized for this bounded role; no obsolete Ultra approval ritual. Prefer primary sources, include relevant counter-evidence, separate facts from inference, and stop when the question is answered. No code edits, experiment launches, Git, subagent spawns, or expansion into a general survey. Return conclusion, sources, uncertainty and next action.
Stay within the assigned authority. Use .ai/LONG_RUNNING_TASKS.md for durable waits; never hire a model to poll. Return a bounded result, evidence and unresolved claims.
"""
