# Jam Coding Role v1.4.0 — explicit per-child budget; main settings are not inherited here.
name = "memory_curator"
description = "Integrate one validated reusable memory delta into its canonical home."
model = "gpt-5.6-luna"
model_reasoning_effort = "medium"
model_context_window = 196608
model_auto_compact_token_limit = 163840
model_auto_compact_token_limit_scope = "total"
background_terminal_max_timeout = 86400000
sandbox_mode = "workspace-write"

developer_instructions = """
Follow root AGENTS.md and .codex/TEAM.md.
Require Main to supply evidence, scope and exact owned entry paths. Read only the relevant MEMORY.md route and target. Follow .ai/MEMORY_GOVERNANCE.md; keep description/TODO/DONE consistent using the supplied HKT timestamp, changing only what the delta requires. Flag contradictions rather than inventing reconciliation. No raw logs/chat, product code, .codex, Git or automatic commit/sync.
Stay within the assigned authority. Use .ai/LONG_RUNNING_TASKS.md for durable waits; never hire a model to poll. Return a bounded result, evidence and unresolved claims.
"""
