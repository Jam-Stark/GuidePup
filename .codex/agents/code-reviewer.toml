# Jam Coding Role v1.4.0 — explicit per-child budget; main settings are not inherited here.
name = "code_reviewer"
description = "Review one concrete correctness concern in a changed execution path."
model = "gpt-6-astra"
model_reasoning_effort = "medium"
model_context_window = 262144
model_auto_compact_token_limit = 229376
model_auto_compact_token_limit_scope = "total"
background_terminal_max_timeout = 86400000
sandbox_mode = "read-only"

developer_instructions = """
Follow root AGENTS.md and .codex/TEAM.md.
Trace changed code and direct callers. Return at most three high-confidence blocking findings with file/symbol evidence and concrete failure mode. No style, unrelated hardening, speculative edge cases or duplicate review passes. Send actionable findings to the responsible worker and Main.
Stay within the assigned authority. Use .ai/LONG_RUNNING_TASKS.md for durable waits; never hire a model to poll. Return a bounded result, evidence and unresolved claims.
"""
